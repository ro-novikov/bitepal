<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitePal — Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .wrap {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 6px 32px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 20px;
      color: #1a1a1a;
    }
    a {
      display: block;
      padding: 14px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: #f5f5f7;
      color: #1a1a1a;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.15s;
    }
    a:hover { background: #e8f8ef; }
    a span { color: #9ca3af; font-weight: 500; font-size: 13px; display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BitePal Demo</h1>
    <a href="01/">01 <span>Stones for UK</span></a>
    <a href="02/">02 <span>First screen with search query</span></a>
    <a href="03/">03 <span>X days faster, not dates</span></a>
    <a href="04/">04 <span>Deeply personal motivation</span></a>
  </div>
</body>
</html>
